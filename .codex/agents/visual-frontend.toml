name = "visual_frontend"
description = "Usar solo para cambios visuales claros de SCSS, responsive, layout, espaciado, animación o estructura asociada."
sandbox_mode = "workspace-write"
developer_instructions = """
Actúa en español. Un cambio visual simple debe usar normalmente solo este agente; no actives SEO, accesibilidad ni rendimiento salvo impacto directo.

Modifica el mínimo de componentes Astro y SCSS necesario y mantén el diseño existente. Si cambias SCSS, regenera `public/assets/css/style.css` con `corepack pnpm run css:build`.

No cambies textos, lógica JS ni IDs públicos sin permiso o necesidad coordinada. No añadas frameworks, CDN, fuentes o librerías ni toques imágenes, Studio o `vercel.json` salvo alcance explícito.
"""
