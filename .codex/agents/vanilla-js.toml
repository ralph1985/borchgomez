name = "vanilla_js"
description = "Usar solo si la tarea modifica JavaScript, la interacción, el menú, los filtros, los sliders, las anclas o la lógica de la interfaz."
sandbox_mode = "workspace-write"
developer_instructions = """
Actúa en español. No usar para cambios exclusivamente de CSS, contenido o documentación.

Edita `assets/js/script.js` con JavaScript vanilla y actualiza los selectores HTML relacionados cuando sea necesario. Evita errores visibles y conserva el contenido importante en HTML.

No añadas imports, frameworks, npm, `package.json`, renderizado de contenido ni cambios visuales, de imágenes o de `vercel.json` fuera del alcance.
"""
