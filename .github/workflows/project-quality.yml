name: Project quality

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/project-quality.yml"
      - "astro.config.mjs"
      - "eslint.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "prettier.config.js"
      - "public/assets/**"
      - "scripts/**"
      - "src/**"
      - "studio/**"
      - "stylelint.config.js"
      - "tsconfig.json"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build and generated files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Studio dependencies
        run: corepack pnpm --dir studio install --frozen-lockfile

      - name: Run lint
        run: corepack pnpm run lint

      - name: Build site
        run: corepack pnpm run build

      - name: Verify generated files
        run: |
          if ! git diff --exit-code -- public/assets/css/style.css src/infrastructure/content/data; then
            echo "::error::La build o el CSS compilado han dejado cambios. Ejecuta los scripts correspondientes y commitea los resultados."
            exit 1
          fi

      - name: Verify asset cache busting
        run: |
          scripts/bump-asset-version.sh
          if ! git diff --exit-code -- src/infrastructure/content/data; then
            echo "::error::Ejecuta scripts/bump-asset-version.sh y commitea los cambios generados."
            exit 1
          fi

      - name: Verify diff whitespace
        run: git diff --check

  asset-reports:
    name: Asset reports
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Report possible orphan assets
        run: |
          python3 scripts/find-orphan-assets.py | tee possible-orphan-assets.md
          cat possible-orphan-assets.md >> "$GITHUB_STEP_SUMMARY"

      - name: Report largest images
        run: |
          python3 scripts/report-heavy-images.py | tee heavy-images.md
          cat heavy-images.md >> "$GITHUB_STEP_SUMMARY"
