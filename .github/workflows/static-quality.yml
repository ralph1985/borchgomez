name: Static quality

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  cache-busting:
    name: Cache busting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify asset versions
        run: |
          ./scripts/bump-asset-version.sh
          if ! git diff --exit-code; then
            echo "::error::Ejecuta el script de cache busting y commitea los cambios generados."
            exit 1
          fi

  possible-orphan-assets:
    name: Possible orphan assets
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Report possible orphan assets
        run: |
          python3 scripts/find-orphan-assets.py | tee possible-orphan-assets.md
          cat possible-orphan-assets.md >> "$GITHUB_STEP_SUMMARY"

  heavy-images:
    name: Heavy images
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Report largest images
        run: |
          python3 scripts/report-heavy-images.py | tee heavy-images.md
          cat heavy-images.md >> "$GITHUB_STEP_SUMMARY"
