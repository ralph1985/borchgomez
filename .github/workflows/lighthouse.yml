name: Lighthouse

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "**/*.html"
      - "assets/**"
      - ".github/workflows/lighthouse.yml"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Start local server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/borchgomez-http.log 2>&1 &
          echo $! > /tmp/borchgomez-http.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/borchgomez-http.log
          exit 1

      - name: Run Lighthouse
        run: |
          mkdir -p lighthouse-results
          npm exec --yes --package=lighthouse@13.3.0 -- lighthouse \
            http://127.0.0.1:8080/ \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output=html \
            --output-path=lighthouse-results/report

          json_report="$(find lighthouse-results -maxdepth 1 -type f -name '*.json' -print -quit)"
          html_report="$(find lighthouse-results -maxdepth 1 -type f -name '*.html' -print -quit)"
          test -n "$json_report"
          test -n "$html_report"
          mv "$json_report" lighthouse-results/lighthouse-report.json
          mv "$html_report" lighthouse-results/lighthouse-report.html

      - name: Publish Lighthouse scores
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('lighthouse-results/lighthouse-report.json', 'utf8'));
          const categories = [
            ['performance', 'Performance'],
            ['accessibility', 'Accessibility'],
            ['best-practices', 'Best Practices'],
            ['seo', 'SEO'],
          ];

          console.log('## Lighthouse');
          console.log('');
          console.log('| Categoría | Puntuación |');
          console.log('| --- | ---: |');
          for (const [key, label] of categories) {
            const score = report.categories[key]?.score;
            if (typeof score !== 'number') {
              throw new Error(`No se encontró la puntuación de ${label}`);
            }
            console.log(`| ${label} | ${Math.round(score * 100)} |`);
          }
          console.log('');
          console.log('Métricas informativas: no se aplican mínimos ni presupuestos.');
          NODE

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-${{ github.event.pull_request.number }}
          path: |
            lighthouse-results/lighthouse-report.json
            lighthouse-results/lighthouse-report.html
          if-no-files-found: error
          retention-days: 30
